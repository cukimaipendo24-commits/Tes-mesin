<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PIXEL MOTOR // 144Hz OVERCLOCKED</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        darkBg: '#05070e',
                        panelBg: 'rgba(13, 19, 36, 0.88)',
                        neonCyan: '#06b6d4',
                        neonRed: '#f43f5e',
                        neonGreen: '#10b981',
                        neonGold: '#facc15'
                    }
                }
            }
        }
    </script>

    <style>
        /* Strict Viewport Lock: Zero Page Scroll */
        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            max-height: 100dvh;
            overflow: hidden !important;
            background-color: #04060b;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        /* Glassmorphism styling */
        .glass-panel {
            background: rgba(13, 19, 36, 0.88);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-btn {
            background: rgba(26, 36, 61, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.12);
            transition: background 0.1s ease, transform 0.05s ease;
        }
        .glass-btn:active {
            transform: scale(0.96);
            background: rgba(38, 52, 86, 0.95);
        }

        /* High Visibility GAS Pedal */
        .pedal-active {
            box-shadow: 0 0 30px rgba(245, 158, 11, 0.85), inset 0 2px 10px rgba(0,0,0,0.6);
            background: linear-gradient(135deg, #f59e0b, #d97706) !important;
            color: #000 !important;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: #070a14; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col h-full w-full justify-between items-center p-1.5 sm:p-2">

    <!-- MAIN APP SHELL (LOCKED AT 100DVH) -->
    <div class="w-full max-w-5xl h-full flex flex-col justify-between overflow-hidden gap-1.5">

        <!-- 1. TOP HEADER BAR (~44px) -->
        <header class="w-full h-11 shrink-0 glass-panel rounded-xl px-2 sm:px-3 flex items-center justify-between gap-1.5 shadow-lg">
            <!-- Brand & FPS Badge -->
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 rounded-lg bg-gradient-to-br from-cyan-400 to-blue-600 flex items-center justify-center font-black text-white shadow-md text-xs">
                    ⚡
                </div>
                <div class="flex items-center gap-1.5">
                    <span class="text-xs sm:text-sm font-extrabold tracking-tight text-white font-mono">
                        PIXEL MOTOR <span class="text-[9px] text-cyan-400 bg-cyan-950/80 px-1.5 py-0.5 rounded border border-cyan-800">144Hz</span>
                    </span>
                    <!-- Real-time FPS Badge -->
                    <span id="fpsBadge" class="text-[10px] font-mono font-bold text-emerald-400 bg-emerald-950/80 px-1.5 py-0.5 rounded border border-emerald-800">
                        144 FPS
                    </span>
                </div>

                <!-- Active Engine Selector Trigger -->
                <button onclick="openModal('engineModal')" class="glass-btn px-2.5 py-1 rounded-lg text-xs font-mono font-bold text-cyan-300 flex items-center gap-1 ml-1 hover:border-cyan-400">
                    <span id="headerEngineTitle">V-TWIN 90° (2 SIL)</span>
                    <span class="text-[10px] text-cyan-500">▾</span>
                </button>
            </div>

            <!-- Exhaust Sound Profile & Audio Controls -->
            <div class="flex items-center gap-1">
                <!-- Sound Profile Selector -->
                <select id="soundProfileSelect" onchange="changeSoundProfile(this.value)" class="bg-slate-900 border border-slate-700 text-[10px] font-mono font-bold text-amber-400 rounded px-1.5 py-1 focus:outline-none">
                    <option value="racing">🏎️ KNALPOT RACING</option>
                    <option value="f1">🏎️ F1 SCREAMER</option>
                    <option value="muscle">🚀 MUSCLE V8 BASS</option>
                    <option value="stock">🚗 STOCK SPORT</option>
                </select>

                <!-- Mute Toggle -->
                <button id="audioMuteBtn" onclick="toggleMute()" class="glass-btn p-1.5 rounded-lg text-xs text-slate-200 hover:text-white" title="Mute/Unmute Audio">
                    🔊
                </button>
            </div>
        </header>

        <!-- 2. MAIN UNCLUTTERED HIGH-FPS CANVAS ENGINE STAGE -->
        <main id="canvasContainer" class="relative w-full flex-1 min-h-[220px] bg-darkBg border border-slate-800/80 rounded-xl overflow-hidden glass-panel flex flex-col shadow-2xl">
            
            <!-- OVERCLOCKED DESYNCHRONIZED CANVAS -->
            <canvas id="engineCanvas" class="w-full h-full block"></canvas>

            <!-- HUD OVERLAY (TOP LEFT) -->
            <div class="absolute top-2 left-2 pointer-events-none flex flex-col gap-1 z-10">
                <div class="bg-slate-950/85 backdrop-blur-md border border-slate-800/80 px-2.5 py-1 rounded-lg flex items-center gap-2 shadow-md">
                    <span id="hudRpm" class="font-mono font-extrabold text-sm sm:text-base text-cyan-400">0 RPM</span>
                    <span class="text-slate-600">|</span>
                    <span id="hudFires" class="font-mono text-xs text-emerald-400">0 LDK/s</span>
                    <span class="text-slate-600">|</span>
                    <span id="hudActiveCyl" class="font-mono text-[11px] text-yellow-400">CYL: #1</span>
                </div>
                <div class="bg-slate-950/80 px-2 py-0.5 rounded text-[10px] font-mono font-bold text-slate-300 border border-slate-800/60 max-w-fit">
                    <span id="hudCycleStage" class="text-cyan-400">LANGKAH: HISAP (0°)</span>
                </div>
                <!-- UNLIMITED BOOST BADGE -->
                <div class="bg-emerald-950/90 border border-emerald-500/50 text-emerald-300 px-2 py-0.5 rounded text-[9px] font-mono font-bold max-w-fit shadow-md">
                    ⚡ UNLIMITED BOOST (TANPA BATAS SUHU)
                </div>
            </div>

            <!-- HUD CONTROLS (TOP RIGHT) -->
            <div class="absolute top-2 right-2 flex flex-col gap-1 z-10">
                <!-- Camera View Mode Toggle -->
                <button onclick="toggleViewMode()" id="viewModeBtn" class="glass-btn px-2 py-1 rounded-lg text-[11px] font-mono font-bold text-cyan-300 flex items-center justify-center gap-1 shadow-md">
                    📷 <span id="viewModeText">DEPAN</span>
                </button>
                <!-- Slow-Mo Toggle -->
                <button onclick="cycleSlowMo()" id="slowMoBtn" class="glass-btn px-2 py-1 rounded-lg text-[11px] font-mono font-bold text-emerald-400 flex items-center justify-center gap-1 shadow-md">
                    👾 <span id="slowMoText">1.0x</span>
                </button>
                <!-- Zoom Control Stepper -->
                <div class="flex items-center gap-0.5 bg-slate-950/85 p-0.5 rounded-lg border border-slate-800 shadow-md">
                    <button onclick="changeZoom(0.15)" class="w-6 h-6 glass-btn rounded text-xs font-bold text-slate-200 flex items-center justify-center">+</button>
                    <span id="zoomText" class="text-[9px] font-mono text-slate-400 w-7 text-center">1.0x</span>
                    <button onclick="changeZoom(-0.15)" class="w-6 h-6 glass-btn rounded text-xs font-bold text-slate-200 flex items-center justify-center">-</button>
                </div>
            </div>

            <!-- ROAD & FIRING ORDER STRIP (BOTTOM EDGE) -->
            <div class="absolute bottom-0 inset-x-0 h-7 bg-slate-950/90 border-t border-slate-800 flex items-center justify-between px-3 text-[10px] font-mono z-10">
                <div class="flex items-center gap-2">
                    <span id="roadSpeedText" class="text-cyan-400 font-bold text-xs">0 km/h</span>
                    <span class="text-slate-600">•</span>
                    <span id="roadGearBadge" class="text-yellow-400 font-bold px-1 rounded bg-slate-900 border border-slate-800">NETRAL (N)</span>
                </div>
                <div class="flex items-center gap-2">
                    <span id="hudFiringOrder" class="text-slate-400 truncate max-w-[160px] sm:max-w-[300px]">PENGAPIAN: 1-2</span>
                </div>
            </div>
        </main>

        <!-- 3. FIXED BOTTOM CONTROL DECK (~130px ALWAYS ANCHORED) -->
        <footer class="w-full h-32 shrink-0 glass-panel rounded-xl p-2 grid grid-cols-12 gap-2 items-center shadow-xl">
            
            <!-- Left: Ignition START / STOP -->
            <button id="startIgnitionBtn" onclick="toggleIgnition()" class="col-span-3 h-full glass-btn rounded-xl flex flex-col items-center justify-center gap-1 text-emerald-400 border-emerald-500/40 hover:border-emerald-500 active:scale-95 transition-all">
                <span class="text-xl">🔑</span>
                <span id="startBtnText" class="font-mono font-extrabold text-xs sm:text-sm">START</span>
                <span class="text-[9px] font-mono text-slate-400 hidden sm:inline">ENGINE</span>
            </button>

            <!-- Center: Ultra Responsive GAS Pedal -->
            <button id="gasPedalBtn" class="col-span-6 h-full bg-gradient-to-r from-amber-500 via-yellow-500 to-amber-600 rounded-xl text-slate-950 font-black font-mono flex flex-col items-center justify-center gap-1 shadow-lg shadow-amber-500/20 active:scale-98 transition-all touch-none select-none relative overflow-hidden">
                <div id="throttleFillOverlay" class="absolute bottom-0 inset-x-0 bg-white/25 transition-all duration-75 pointer-events-none" style="height: 0%"></div>
                <div class="relative z-10 flex items-center gap-1.5 text-sm sm:text-base">
                    <span>🔥</span>
                    <span>TAHAN GAS</span>
                </div>
                <div class="relative z-10 text-[10px] font-mono font-semibold text-slate-900/80 hidden sm:block">
                    (SPASI / PANAH ATAS)
                </div>
            </button>

            <!-- Right: Shifter & Brake Controls -->
            <div class="col-span-3 h-full flex flex-col justify-between gap-1">
                <div class="grid grid-cols-2 gap-1 h-7">
                    <button id="handbrakeToggleBtn" onclick="toggleHandbrake()" class="glass-btn rounded text-[9px] font-mono font-bold text-yellow-400 flex items-center justify-center">
                        <span id="handbrakeLabel">REM: OFF</span>
                    </button>
                    <button id="transmissionToggleBtn" onclick="toggleTransmissionMode()" class="glass-btn rounded text-[9px] font-mono font-bold text-cyan-300 flex items-center justify-center">
                        <span id="transLabel">OTOMATIS</span>
                    </button>
                </div>

                <!-- Gear Stepper -->
                <div class="flex-1 flex items-center justify-between bg-slate-950 rounded-lg border border-slate-800 p-1">
                    <button onclick="shiftGear(-1)" class="w-8 h-full glass-btn rounded text-slate-200 font-bold flex items-center justify-center text-xs">▼</button>
                    <div class="flex flex-col items-center font-mono">
                        <span class="text-[8px] text-slate-500">GIGI</span>
                        <span id="gearBadgeText" class="font-black text-cyan-400 text-xs sm:text-sm">N</span>
                    </div>
                    <button onclick="shiftGear(1)" class="w-8 h-full glass-btn rounded text-slate-200 font-bold flex items-center justify-center text-xs">▲</button>
                </div>
            </div>
        </footer>
    </div>

    <!-- CUSTOM TOAST NOTIFICATION OVERLAY -->
    <div id="toastNotice" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 pointer-events-none opacity-0 translate-y-[-10px] transition-all duration-200 bg-slate-900 border border-cyan-500/50 text-cyan-200 text-xs font-mono px-4 py-2 rounded-xl shadow-2xl flex items-center gap-2">
        <span id="toastIcon">ℹ️</span>
        <span id="toastMessage">Notifikasi</span>
    </div>

    <!-- MODAL: ENGINE SELECTOR (1 TO 24 CYLINDERS & PRESETS) -->
    <div id="engineModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-3">
        <div class="glass-panel w-full max-w-xl max-h-[92vh] flex flex-col p-4 rounded-2xl gap-3 border-slate-700 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-2">
                <div class="flex items-center gap-2">
                    <span class="text-base">⚙️</span>
                    <h3 class="font-bold text-xs sm:text-sm text-white font-mono">PILIH MESIN (1 - 24 SILINDER)</h3>
                </div>
                <button onclick="closeModal('engineModal')" class="text-slate-400 hover:text-white font-bold text-xs">✕ TUTUP</button>
            </div>

            <!-- Custom Builder -->
            <div class="bg-slate-950/90 p-3 rounded-xl border border-slate-800 flex flex-col gap-2.5">
                <div class="flex justify-between items-center text-xs font-mono">
                    <span class="text-slate-300 font-semibold">Jumlah Silinder Kustom:</span>
                    <span id="customCylLabel" class="text-cyan-400 font-extrabold text-sm">2 Silinder</span>
                </div>
                <input type="range" id="cylRangeSlider" min="1" max="24" value="2" oninput="onCustomCylSlide(this.value)" class="w-full accent-cyan-500 cursor-pointer">

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5 font-mono">Konfigurasi</label>
                        <select id="customLayoutSelect" onchange="updateAngleOptions()" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-slate-200 font-mono focus:outline-none focus:border-cyan-500">
                            <option value="V-TWIN">V-Twin (Motor V-2)</option>
                            <option value="PARALLEL-TWIN">Parallel Twin (I-2)</option>
                            <option value="BOXER">Flat / Boxer (180°)</option>
                            <option value="INLINE">Inline (Sejajar)</option>
                            <option value="V">V-Engine (Multi-Cyl V)</option>
                            <option value="W">W-Engine (Double V)</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-[10px] text-slate-400 block mb-0.5 font-mono">Sudut V-Bank</label>
                        <select id="customAngleSelect" class="w-full bg-slate-900 border border-slate-700 text-xs rounded p-1.5 text-slate-200 font-mono focus:outline-none focus:border-cyan-500">
                            <option value="90">90° (Ducati / L-Twin)</option>
                            <option value="45">45° (Harley Cruiser)</option>
                            <option value="60">60° (V6 / V12)</option>
                            <option value="72">72° (V10 Exotic)</option>
                            <option value="180">180° (Flat / Boxer)</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button onclick="applyCustomEngineBuild()" class="w-full h-8 bg-cyan-600 hover:bg-cyan-500 text-white text-xs font-bold font-mono rounded transition-all shadow-md">
                            PASANG KUSTOM
                        </button>
                    </div>
                </div>
            </div>

            <div class="text-xs font-mono font-bold text-slate-300">Preset Mesin Ikonik (V1 - V24):</div>
            <div id="presetsGrid" class="overflow-y-auto flex-1 grid grid-cols-1 sm:grid-cols-2 gap-2 pr-1 max-h-[260px]">
                <!-- Dynamic Preset Cards -->
            </div>
        </div>
    </div>

    <!-- JAVASCRIPT ENGINE SIMULATOR & AUDIO SYNTHESIZER -->
    <script>
        /* ==========================================================================
           1. PRESET ENGINE DEFINITIONS (1 - 24 CYLINDERS)
           ========================================================================== */
        const PRESET_ENGINES = [
            { name: 'V-Twin 90° L-Twin', cylinders: 2, layout: 'V-TWIN', angle: 90, desc: 'Ducati Panigale / Monster L-Twin sound' },
            { name: 'V-Twin 45° Harley Cruiser', cylinders: 2, layout: 'V-TWIN', angle: 45, desc: 'Harley Davidson Potato-Potato Rumble' },

            { name: 'Single Cylinder V1', cylinders: 1, layout: 'INLINE', angle: 0, desc: 'Mesin Motor 1 Silinder' },
            { name: 'Inline-3 Turbo', cylinders: 3, layout: 'INLINE', angle: 0, desc: 'City Car 3 Silinder Efficient' },
            { name: 'Inline-4 DOHC 16V', cylinders: 4, layout: 'INLINE', angle: 0, desc: 'Standard Sports 4-Cylinder' },
            { name: 'Boxer-4 Flat', cylinders: 4, layout: 'BOXER', angle: 180, desc: 'Subaru EJ25 Boxer Engine' },
            { name: 'Inline-5 Turbo', cylinders: 5, layout: 'INLINE', angle: 0, desc: 'Audi Sport Quattro 5-Cyl' },
            { name: 'Inline-6 2JZ / RB26', cylinders: 6, layout: 'INLINE', angle: 0, desc: 'Legendary Supra Twin-Turbo I6' },
            { name: 'V6 Twin-Turbo 60°', cylinders: 6, layout: 'V', angle: 60, desc: 'GT-R VR38 / Supercar V6' },
            { name: 'Flat-6 Boxer 180°', cylinders: 6, layout: 'BOXER', angle: 180, desc: 'Porsche 911 GT3 Flat-6' },
            { name: 'V8 Crossplane Muscle', cylinders: 8, layout: 'V', angle: 90, desc: 'American V8 Deep Rumble Sound' },
            { name: 'V10 F1 Screamer', cylinders: 10, layout: 'V', angle: 72, desc: 'LFA / Gallardo Screaming V10' },
            { name: 'V12 Quad-Cam Symphony', cylinders: 12, layout: 'V', angle: 60, desc: 'Italian Supercar V12 Harmony' },
            { name: 'W16 Quad-Turbo Monster', cylinders: 16, layout: 'W', angle: 90, desc: 'Bugatti Chiron W16 Hypercar' },
            { name: 'V20 Heavy Locomotive', cylinders: 20, layout: 'V', angle: 60, desc: 'Diesel Locomotive Engine' },
            { name: 'V24 Extreme Marine Monster', cylinders: 24, layout: 'V', angle: 60, desc: 'Raksasa 24 Silinder Super Power' }
        ];

        let currentEngine = {
            name: 'V-Twin 90° L-Twin',
            cylinders: 2,
            layout:
